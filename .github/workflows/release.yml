name: Release Spynel

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify Go implementation
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/spynel
          ./scripts/smoke.sh
          node npm/test.js
          cross_dir=$(mktemp -d)
          trap 'rm -rf "$cross_dir"' EXIT
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o "$cross_dir/spynel.exe" ./cmd/spynel

      - name: Verify tag and npm versions agree
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const p=require("./package.json"); if (`v${p.version}` !== process.env.RELEASE_TAG) process.exit(1)'

      - name: Build and publish release archives
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - name: Publish npm launcher
        if: startsWith(github.ref, 'refs/tags/') && env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
