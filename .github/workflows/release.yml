name: Release Spynel

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare npm metadata from the GitHub release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node npm/prepare-release.js "$RELEASE_TAG" "$RELEASE_PRERELEASE"

      - name: Verify implementation and release package
        run: |
          node -e 'const p=require("./package.json"); if (p.version === "0.0.0-development") process.exit(1)'
          npm pack --dry-run
          go test ./... github.com/charmbracelet/bubbletea
          go vet ./... github.com/charmbracelet/bubbletea
          mkdir -p .tmp-bin
          go build -o .tmp-bin/spynel ./cmd/spynel
          ./scripts/smoke.sh
          node npm/test.js

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify native installation cleanup
        env:
          CGO_LDFLAGS_ALLOW: '^-Wl,-rpath,@loader_path/lib$'
        run: go test ./internal/startup ./internal/updater

      - name: Build native release archive
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./scripts/package-native.sh "$RELEASE_TAG" "${{ matrix.os }}" "${{ matrix.arch }}" release

      - name: Verify native install and uninstall commands
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p .tmp-artifacts/standalone-prior
          archive="spynel_0.12.1_${TARGET_OS}_${TARGET_ARCH}.tar.gz"
          curl -LfS --retry 3 -o ".tmp-artifacts/standalone-prior/$archive" "https://github.com/agent0ai/spynel/releases/download/v0.12.1/$archive"
          curl -LfS --retry 3 -o .tmp-artifacts/standalone-prior/checksums.txt https://github.com/agent0ai/spynel/releases/download/v0.12.1/checksums.txt
          (cd .tmp-artifacts/standalone-prior && grep "  $archive$" checksums.txt | shasum -a 256 -c -)
          python3 scripts/test-standalone.py ".tmp-artifacts/standalone-prior/$archive" "release/spynel_${RELEASE_TAG#v}_${TARGET_OS}_${TARGET_ARCH}.tar.gz"

      - name: Run native harness contract and packaged-archive smoke
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: go run ./scripts/native-evidence --archive-dir release --output "evidence/native-${{ matrix.os }}-${{ matrix.arch }}.json" --ref "$RELEASE_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: spynel-archive-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: Retain native compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: spynel-evidence-${{ matrix.os }}-${{ matrix.arch }}
          path: evidence/native-${{ matrix.os }}-${{ matrix.arch }}.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/download-artifact@v4
        with:
          pattern: spynel-archive-*
          path: release
          merge-multiple: true

      - name: Create release checksums
        run: (cd release && sha256sum spynel_* > checksums.txt)

      - name: Attach native archives and checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prepare npm metadata from the GitHub release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node npm/prepare-release.js "$RELEASE_TAG" "$RELEASE_PRERELEASE"

      - name: Publish npm launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
