name: Release Spynel

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to validate without publishing (for example v0.12.9)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare npm metadata from the GitHub release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: node npm/prepare-release.js "$RELEASE_TAG" "$RELEASE_PRERELEASE"

      - name: Verify implementation and release package
        run: |
          node -e 'const p=require("./package.json"); if (p.version === "0.0.0-development") process.exit(1)'
          npm pack --dry-run
          go test ./... github.com/charmbracelet/bubbletea
          go vet ./... github.com/charmbracelet/bubbletea
          mkdir -p .tmp-bin
          go build -o .tmp-bin/spynel ./cmd/spynel
          ./scripts/smoke.sh
          node npm/test.js

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify native installation cleanup
        env:
          CGO_LDFLAGS_ALLOW: '^-Wl,-rpath,@loader_path/lib$'
        run: go test ./internal/startup ./internal/updater

      - name: Install Linux packaging tool
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends patchelf

      - name: Build native release archive
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: ./scripts/package-native.sh "$RELEASE_TAG" "${{ matrix.os }}" "${{ matrix.arch }}" release

      - name: Verify native install and uninstall commands
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p .tmp-artifacts/standalone-prior
          archive="spynel_0.12.17_${TARGET_OS}_${TARGET_ARCH}.tar.gz"
          curl -LfS --retry 3 -o ".tmp-artifacts/standalone-prior/$archive" "https://github.com/agent0ai/spynel/releases/download/v0.12.17/$archive"
          curl -LfS --retry 3 -o .tmp-artifacts/standalone-prior/checksums.txt https://github.com/agent0ai/spynel/releases/download/v0.12.17/checksums.txt
          (cd .tmp-artifacts/standalone-prior && grep "  $archive$" checksums.txt | shasum -a 256 -c -)
          python3 scripts/test-standalone.py ".tmp-artifacts/standalone-prior/$archive" "release/spynel_${RELEASE_TAG#v}_${TARGET_OS}_${TARGET_ARCH}.tar.gz"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify updates across live instances and terminals
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python3 scripts/test-instance-updates.py "release/spynel_${RELEASE_TAG#v}_${TARGET_OS}_${TARGET_ARCH}.tar.gz"

      - name: Verify native supervision and terminal recovery
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python3 scripts/test-native-supervisor.py "release/spynel_${RELEASE_TAG#v}_${TARGET_OS}_${TARGET_ARCH}.tar.gz"

      - name: Verify authentic affected-version upgrade
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p .tmp-artifacts/affected-prior evidence
          archive="spynel_0.13.3_${TARGET_OS}_${TARGET_ARCH}.tar.gz"
          curl -LfS --retry 3 -o ".tmp-artifacts/affected-prior/$archive" "https://github.com/agent0ai/spynel/releases/download/v0.13.3/$archive"
          curl -LfS --retry 3 -o .tmp-artifacts/affected-prior/checksums.txt https://github.com/agent0ai/spynel/releases/download/v0.13.3/checksums.txt
          (cd .tmp-artifacts/affected-prior && grep "  $archive$" checksums.txt | shasum -a 256 -c -)
          curl -LfS --retry 3 -o .tmp-artifacts/affected-prior/spynel-0.13.3.tgz https://registry.npmjs.org/spynel/-/spynel-0.13.3.tgz
          (cd .tmp-artifacts/affected-prior && printf '%s  %s\n' c45bb8e1670a2d9f76dbfa1572da4cc230cb54561be53fa96f9ee4aaeac2674b spynel-0.13.3.tgz | shasum -a 256 -c -)
          python3 scripts/test-affected-upgrade.py .tmp-artifacts/affected-prior/spynel-0.13.3.tgz ".tmp-artifacts/affected-prior/$archive" "release/spynel_${RELEASE_TAG#v}_${TARGET_OS}_${TARGET_ARCH}.tar.gz" | tee "evidence/affected-upgrade-${TARGET_OS}-${TARGET_ARCH}.jsonl"

      - name: Run native harness contract and packaged-archive smoke
        shell: bash
        env:
          EVIDENCE_REF: ${{ github.event.release.tag_name || github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: go run ./scripts/native-evidence --archive-dir release --output "evidence/native-${{ matrix.os }}-${{ matrix.arch }}.json" --ref "$EVIDENCE_REF"

      - uses: actions/upload-artifact@v4
        with:
          name: spynel-archive-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: Retain native compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: spynel-evidence-${{ matrix.os }}-${{ matrix.arch }}
          path: evidence/native-${{ matrix.os }}-${{ matrix.arch }}.json
          if-no-files-found: error

      - name: Retain affected-version upgrade evidence
        uses: actions/upload-artifact@v4
        with:
          name: spynel-upgrade-${{ matrix.os }}-${{ matrix.arch }}
          path: evidence/affected-upgrade-${{ matrix.os }}-${{ matrix.arch }}.jsonl
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: spynel-archive-*
          path: release
          merge-multiple: true

      - name: Create release checksums
        run: (cd release && sha256sum spynel_* > checksums.txt)

      - name: Attach native archives and checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prepare npm metadata from the GitHub release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: node npm/prepare-release.js "$RELEASE_TAG" "$RELEASE_PRERELEASE"

      - name: Publish npm launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
