version: 2

project_name: spynel

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: spynel
    main: ./cmd/spynel
    binary: spynel
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

homebrew_casks:
  - repository:
      owner: frdel
      name: homebrew-tap
    homepage: https://github.com/frdel/spynel
    description: Extensible chat and markdown orchestrator for coding agents
    license: MIT

scoops:
  - repository:
      owner: frdel
      name: scoop-bucket
    homepage: https://github.com/frdel/spynel
    description: Extensible chat and markdown orchestrator for coding agents
    license: MIT
