version: 1

workspace:
  history_max_messages: 50
  history_char_limit: 12000
  cleanup_retention_days: 30
  attachment_max_mb: 100

harness:
  name: ""
  model: ""
  sandbox: danger-full-access
  chat_agent_prefix: ""
  developer_agent_prefix: ""
  reviewer_agent_prefix: ""
  heartbeat_agent_prefix: ""
  # skip-trivial lets each task creator decide; always and never override it.
  reviews: skip-trivial
  # Used only when name is acp. Built-in ACP aliases supply these themselves.
  acp_command: ""
  acp_args: []

channels:
  tui:
    title: Spynel
    theme: spynel
  telegram:
    enabled: false
    name: spynel
    token_env: SPYNEL_TELEGRAM_TOKEN
    mode: polling
    webhook_url: ""
    webhook_listen: 127.0.0.1:8787
    webhook_secret: ""
    allowed_users: []
    poll_timeout_seconds: 30
    group_mode: mention
    welcome_enabled: false
    welcome_message: "Welcome, {name}!"
    notify_messages: false
    attachment_max_age_hours: 0
  whatsapp:
    enabled: false
    mode: self-chat
    database: .spynel/whatsapp.db
    allowed_numbers: []
    allow_groups: false
    poll_interval_seconds: 3

speech:
  enabled: true
  model_dir: ""
  language: en
  num_threads: 2
  max_file_mb: 100
  max_duration_seconds: 1800
  chunk_seconds: 600

startup:
  enabled: false

orchestrator:
  enabled: true
  interval_seconds: 10
  # Automatically processes stalled messages after restarts and disconnects.
  retrigger_unresponded_messages: true
  # Higher-level agent audit; 0 disables it. Changes take effect live.
  semantic_heartbeat_minutes: 15
  # off, decide (agent sends or records a skip once), or always (agent sends unless safely impossible).
  task_notifications: decide
  max_parallel: 4
  routes:
    - name: tasks
      source: .spynel/tasks/todo
      working: .spynel/tasks/working
      prompt: .spynel/prompts/task.md
      recovery_prompt: .spynel/prompts/recovery.md
      review_prompt: .spynel/prompts/review.md
      stale_after: 30m
      allowed_next: [todo, working, review, reviewing, waiting, done, failed, cancelled]
    - name: goals
      source: .spynel/goals/proposed
      working: .spynel/goals/planning
      prompt: .spynel/prompts/goal.md
      recovery_prompt: .spynel/prompts/recovery.md
      review_prompt: .spynel/prompts/goal-review.md
      stale_after: 2h
      allowed_next: [proposed, planning, active, review, reviewing, waiting, done, abandoned]

extensions:
  enabled: true
  directory: .spynel/extensions
  hook_timeout: 30s
